name: tyre_management
description: A Tyre Management App - Tyre Track

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  firebase_messaging: ^16.1.3
  firebase_analytics: ^12.2.0
  firebase_crashlytics: ^5.1.0
  cloud_functions: ^6.1.0

  # State & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Design & UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0

  # Forms
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.3.0

  # Notifications
  flutter_local_notifications: ^17.1.1

  # Payments
  razorpay_flutter: ^1.3.6

  # Images
  image_picker: ^1.1.0

  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.2
  google_sign_in: ^6.2.1
  share_plus: ^12.0.2
  connectivity_plus: ^6.0.0
  add_2_calendar: ^3.0.1
  uuid: ^4.5.3

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/